name: Build Windows EXE

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name CANFlow
          --add-data "canflow/assets;canflow/assets"
          run.py

      - name: Check EXE
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/CANFlow.exe)) {
            throw 'PyInstaller did not create dist/CANFlow.exe'
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CANFlow-windows-${{ github.sha }}
          path: dist/CANFlow.exe
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionRelease = $env:GITHUB_REF_TYPE -eq 'tag'
          if ($versionRelease) {
            $version = python -c "from canflow import __version__; print(__version__)"
            if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "v$version") {
              throw 'Version tag does not match canflow.__version__'
            }
          }
          $tag = if ($versionRelease) { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_SHA" }
          $title = if ($versionRelease) { "CANFlow $tag" } else { "CANFlow $($env:GITHUB_SHA.Substring(0, 7))" }
          $releaseFlags = if ($versionRelease) { @('--verify-tag', '--latest') } else { @('--prerelease', '--latest=false') }
          $notesPath = "docs/releases/$($env:GITHUB_REF_NAME -replace '^v', '').md"
          $notesFlags = if ($versionRelease -and (Test-Path -LiteralPath $notesPath)) {
            @('--notes-file', $notesPath)
          } else {
            @('--notes', "Windows EXE built from commit $env:GITHUB_SHA.")
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/CANFlow.exe `
              --target $env:GITHUB_SHA `
              --title $title `
              @notesFlags `
              @releaseFlags
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $tag"
            }
          }
          gh release view $tag --json url --jq .url | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

